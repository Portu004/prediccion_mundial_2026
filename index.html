<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador del Mundial 2026</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="header">
        <div class="header-inner">
            <h1>SIMULADOR DEL <span>MUNDIAL 2026</span></h1>
            <p class="header-subtitle">Cómo quedarían los cruces de la etapa final</p>
            <div class="header-balls">⚽ 🏆 </div>
            <div class="group-indicators" id="groupIndicators"></div>
        </div>
    </header>

    <!-- ========== MAIN ========== -->
    <main class="container">

        <!-- FASE DE GRUPOS -->
        <section>
            <h2 class="section-title">Fase de Grupos: Seleccioná el 1°, 2° y 3° de cada grupo</h2>
            <div class="groups-container" id="groupsContainer"></div>
        </section>

        <!-- TABLA DE TERCEROS -->
        <section class="third-place-section">
            <div class="third-place-header">
                <h2 class="section-title" style="margin:0; border:none; padding:0;">Tabla de Terceros</h2>
                <div class="third-place-counter" id="thirdPlaceCounter">0/8 clasificados</div>
            </div>
            <p class="third-place-description">
                Hacé clic en los equipos para seleccionar los 8 mejores terceros que clasifican
            </p>
            <div class="third-place-grid" id="thirdPlaceGrid"></div>
        </section>

        <!-- BRACKET / CUADRO FINAL -->
        <section class="bracket-section">
            <h2 class="section-title">Cruces de la Etapa Final</h2>
            <div class="bracket-wrapper">
                <div id="bracketContainer"></div>
            </div>
        </section>

    </main>

    <!-- ========== SCRIPT ========== -->
    <script src="app.js"></script>

</body>
</html>
